# Builds the Tamagotchi Catppuccin status module (@catppuccin_status_tama).
#
# This must be sourced as its own top-level `tmux source-file` invocation
# (see the `run-shell` call in .tmux.conf), not nested inside another
# source-file. Catppuccin's own catppuccin_tmux.conf sources every built-in
# status/*.conf module unconditionally at load time (application, battery,
# ..., weather), each briefly repointing the shared `%hidden MODULE_NAME`
# variable to build its own module. When this file was instead sourced
# directly from .tmux.conf right after `run tpm`, `${MODULE_NAME}` inside it
# resolved to "weather" (the last built-in module processed) instead of
# "tama", silently producing an empty module — 100% reproducible on a fresh
# server, not a timing race. Sourcing it from a separate top-level
# `tmux source-file` call sidesteps whatever nested-source scoping quirk
# causes that (confirmed empirically; not documented behavior).
%hidden MODULE_NAME="tama"
set -g "@catppuccin_${MODULE_NAME}_icon" "󰚩 "
set -gF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_mauve}"
set -g "@catppuccin_${MODULE_NAME}_text" "#{E:@tama_status_summary}"
source-file ~/.tmux/plugins/tmux/utils/status_module.conf
