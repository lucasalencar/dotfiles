# Builds the machine/profile Catppuccin status module
# (@catppuccin_status_profile). Shows the dotfiles profile (e.g.
# "mac-personal") so the machine is identified independently of the tmux
# session name (which always starts as "main").
#
# This must be sourced as its own top-level `tmux source-file` invocation
# (see the `run-shell` call in .tmux.conf), not nested inside another
# source-file — see tama-status-module.conf for why.
%hidden MODULE_NAME="profile"
set -g "@catppuccin_${MODULE_NAME}_icon" "  "
set -gF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_blue}"
set -g "@catppuccin_${MODULE_NAME}_text" " #($DOTFILES_ROOT/tmux/scripts/tmux-profile-name)"
source-file ~/.tmux/plugins/tmux/utils/status_module.conf
